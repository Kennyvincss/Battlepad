<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>BATTLE — 1v1 Token Battle Launchpad</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚔️</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"><div style="font-family:system-ui,sans-serif;color:#64748b;text-align:center;padding:80px 20px">Loading BATTLE…</div></div>
    <script>
      // If the app hasn't rendered after 12s (script blocked, old browser, network), say so instead of a blank page.
      setTimeout(function () {
        var r = document.getElementById('root');
        if (r && r.textContent && r.textContent.indexOf('Loading BATTLE') === 0) {
          r.firstChild.innerHTML = 'BATTLE is taking too long to load.<br><br><button onclick="location.reload()" style="padding:10px 18px;border-radius:10px;border:1px solid #d5dae5;background:#fff;font-weight:700;cursor:pointer">Reload</button><br><br><small>If this keeps happening, update your browser or try another one.</small>';
        }
      }, 12000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
